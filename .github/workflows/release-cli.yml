name: Release CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: darwin
            goarch: amd64
            suffix: ''
          - goos: darwin
            goarch: arm64
            suffix: ''
          - goos: windows
            goarch: amd64
            suffix: '.exe'
          - goos: windows
            goarch: arm64
            suffix: '.exe'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Extract version
        shell: bash
        run: |
          RAW_VERSION=${GITHUB_REF_NAME}
          if [[ ! "$RAW_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid CLI release tag: $RAW_VERSION" >&2
            exit 1
          fi
          VERSION=${RAW_VERSION#v}
          SOURCE_VERSION=$(sed -nE 's/^var Version = "([^"]+)"/\1/p' cmd/infraguard/cmd/version.go)
          if [[ "$SOURCE_VERSION" != "$VERSION" ]]; then
            echo "Version mismatch: tag ${VERSION}, cmd/infraguard/cmd/version.go ${SOURCE_VERSION}" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "ASSET_VERSION=${RAW_VERSION}" >> $GITHUB_ENV

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist
          BINARY_NAME=infraguard-${{ env.ASSET_VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
          go build -ldflags "-s -w -X github.com/aliyun/infraguard/cmd/infraguard/cmd.Version=${{ env.VERSION }}" \
            -o "dist/${BINARY_NAME}" ./cmd/infraguard

      - name: Smoke test linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        shell: bash
        run: |
          dist/infraguard-${{ env.ASSET_VERSION }}-linux-amd64 version | grep "${{ env.VERSION }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/infraguard-*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        shell: bash
        run: |
          RAW_VERSION=${GITHUB_REF_NAME}
          if [[ ! "$RAW_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid CLI release tag: $RAW_VERSION" >&2
            exit 1
          fi
          VERSION=${RAW_VERSION#v}
          SOURCE_VERSION=$(sed -nE 's/^var Version = "([^"]+)"/\1/p' cmd/infraguard/cmd/version.go)
          if [[ "$SOURCE_VERSION" != "$VERSION" ]]; then
            echo "Version mismatch: tag ${VERSION}, cmd/infraguard/cmd/version.go ${SOURCE_VERSION}" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "ASSET_VERSION=${RAW_VERSION}" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Create release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp artifacts/infraguard-* release-assets/
          mkdir -p policy-archive/policies
          find policies -mindepth 1 -maxdepth 1 -type d ! -name testdata -exec cp -R {} policy-archive/policies/ \;
          tar -C policy-archive -czf "release-assets/infraguard-policies-${{ env.VERSION }}.tar.gz" policies
          printf '%s\n' "${{ env.VERSION }}" > release-assets/version.txt
          cd release-assets
          sha256sum infraguard-* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CLI ${{ env.VERSION }}"
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(env.VERSION, '-rc') || contains(env.VERSION, '-beta') || contains(env.VERSION, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger release webhook
        env:
          RELEASE_WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
          RELEASE_WEBHOOK_TOKEN: ${{ secrets.RELEASE_WEBHOOK_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${RELEASE_WEBHOOK_URL}" ]]; then
            echo "RELEASE_WEBHOOK_URL is not set; skipping explicit webhook call."
            exit 0
          fi
          if [[ -z "${RELEASE_WEBHOOK_TOKEN}" ]]; then
            echo "RELEASE_WEBHOOK_TOKEN is not set; cannot sign release webhook payload." >&2
            exit 1
          fi

          payload_file=$(mktemp)
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" > /tmp/release.json
          gh api "repos/${GITHUB_REPOSITORY}" > /tmp/repository.json
          jq -n \
            --slurpfile release /tmp/release.json \
            --slurpfile repository /tmp/repository.json \
            '{action: "edited", release: $release[0], repository: $repository[0]}' \
            > "${payload_file}"

          signature=$(openssl dgst -sha256 -hmac "${RELEASE_WEBHOOK_TOKEN}" "${payload_file}" | awk '{print $2}')
          delivery_id=$(uuidgen | tr '[:upper:]' '[:lower:]')
          task_id="${delivery_id}"
          response_file=$(mktemp)

          http_code=$(curl --silent --show-error \
            --output "${response_file}" \
            --write-out "%{http_code}" \
            --retry 3 --retry-delay 5 --connect-timeout 10 --max-time 20 \
            --request POST \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Hookshot/${GITHUB_RUN_ID}" \
            -H "X-GitHub-Event: release" \
            -H "X-GitHub-Delivery: ${delivery_id}" \
            -H "X-GitHub-Hook-Installation-Target-Type: repository" \
            -H "X-Hub-Signature-256: sha256=${signature}" \
            -H "X-Fc-Invocation-Type: Async" \
            -H "X-Fc-Async-Task-Id: ${task_id}" \
            --data-binary "@${payload_file}" \
            "${RELEASE_WEBHOOK_URL}")

          case "${http_code}" in
            2*)
              echo "Submitted FC async release sync task ${task_id}."
              cat "${response_file}"
              ;;
            409)
              echo "FC async release sync task ${task_id} was already submitted."
              cat "${response_file}"
              ;;
            *)
              echo "Failed to submit FC async release sync task ${task_id}; HTTP ${http_code}." >&2
              cat "${response_file}" >&2
              exit 1
              ;;
          esac
